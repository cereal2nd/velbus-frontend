name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap frontend toolchain
        run: ./script/bootstrap
      - name: Lint
        run: yarn lint
        env:
          SKIP_FETCH_NIGHTLY_TRANSLATIONS: "1"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap frontend toolchain
        run: ./script/bootstrap
      - name: Build frontend
        run: yarn build
      - name: Verify build output
        run: test -f velbus_frontend/dist/velbus-panel.js
